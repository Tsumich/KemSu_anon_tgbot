services:
  bot:
    build: .
    container_name: kemsu_anon_bot
    restart: always
    env_file:
      - .env
    volumes:
      - sqlite_data:/data
    

  nginx:
    image: nginx:latest
    container_name: nginx_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - bot
      - phpliteadmin

  phpliteadmin:
    image: ojooss/phpliteadmin:latest
    container_name: phpliteadmin_db_gui
    restart: always
    ports:
      - "8080:80"    
    env_file:
      - .env
    environment:
      PHPLITEADMIN_PASSWORD: ${ADMINER_PASSWORD}
      PHPLITEADMIN_DIRECTORY: '/data'
    volumes:
      - sqlite_data:/data
    depends_on:
      - bot
volumes:
  sqlite_data:
    driver: local
